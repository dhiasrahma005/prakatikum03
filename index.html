<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: arial, helvetica, sans-serif;
        }


        html, body {
         width: 100%;
         height: 100%;
         background-color:rgb(173, 188, 255); 
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color:rgb(135, 108, 255);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;  
            font-weight: bold;
            border: 1px solid;
         }

         nav {
            background-color: #63aafa;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
         }

         .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
         }

         article {
            flex: 3;
            background-color: #ff8ef0;
            padding: 15px;
            border: 1px solid #ec648d;
            display: flex;
            flex-direction: column;
            gap: 10px;
         }

         section {
            background-color: #e74596;
            padding: 15px;
            border: 1px solid #e74596;
            display: flex;
            align-items: center;
         }

         aside {
            flex: 1;
            background-color: #e63bad;
            padding: 15px;
            border: 1px solid #cc1586;
         }

         footer {
            background-color: #f12260;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid;
         }
    </style>
</head>
<body>
   <div class="wrapper">
       <header>
           <img src="dira.jpeg" alt="ini gambarku" width="150px">
           <p>ini website ku</p>
       </header>

       <nav>
         nav
       </nav>
       
       <div class="main-content">
           <article>
             article
             <section>sec</section>
             <section>sec</section>
             <section>sec</section>
           </article>

           <aside>
              aside
           </aside>
       </div>

       <footer>
           footer
       </footer>
   </div> 
</body>
</html>
